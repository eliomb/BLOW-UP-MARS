services:
  wirelight:
    build: .
    ports: ["${WIRELIGHT_BIND_IP:-127.0.0.1}:8080:8080"]
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=16m,noexec,nosuid,nodev"]
    volumes: ["wirelight-data:/data"]   # SSH keys + trusted host keys (only writable location)
    extra_hosts:
      - "host.docker.internal:host-gateway" # Optional LM Studio on Docker host (local mode)
    environment:
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-256}"
      MAX_REMOTE_CAPTURE_MB: "${MAX_REMOTE_CAPTURE_MB:-128}"
      AI_ENABLED: "${AI_ENABLED:-true}"
      AI_PROVIDER: "${AI_PROVIDER:-mistral}"
      AI_CONTEXT_CHARS: "${AI_CONTEXT_CHARS:-55000}"
      AI_PACKET_SAMPLES: "${AI_PACKET_SAMPLES:-72}"
      AI_PAYLOAD_CHARS: "${AI_PAYLOAD_CHARS:-400}"
      AI_DOCKER_NETWORKS: "${AI_DOCKER_NETWORKS:-}"
      AI_REVERSE_PROXY_IPS: "${AI_REVERSE_PROXY_IPS:-}"
      AI_NETWORK_NOTES: "${AI_NETWORK_NOTES:-}"
      MISTRAL_API_KEY: "${MISTRAL_API_KEY:-}"
      MISTRAL_MODEL: "${MISTRAL_MODEL:-ministral-8b-latest}"
      MISTRAL_TIMEOUT: "${MISTRAL_TIMEOUT:-120}"
      LM_STUDIO_HOST: "${LM_STUDIO_HOST:-host.docker.internal}"
      LM_STUDIO_PORT: "${LM_STUDIO_PORT:-1234}"
      LM_STUDIO_SCHEME: "${LM_STUDIO_SCHEME:-http}"
      LM_STUDIO_MODEL: "${LM_STUDIO_MODEL:-local-model}"
      LM_STUDIO_TIMEOUT: "${LM_STUDIO_TIMEOUT:-240}"
      LM_STUDIO_API_KEY: "${LM_STUDIO_API_KEY:-}"
    mem_limit: 1g
    pids_limit: 128
    cpus: 1.5
    restart: unless-stopped
volumes:
  wirelight-data:
